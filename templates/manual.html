<!DOCTYPE html>
<html>

<head>

<title>Manual Prediction</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>Manual Student Prediction</h1>

<form action="/predict" method="POST">

<label>Age</label>
<input type="number" name="age" required>

<label>Gender</label>

<select name="gender">

<option>Male</option>
<option>Female</option>

</select>

<label>City Type</label>

<select name="city_type">

<option>Urban</option>
<option>Rural</option>
<option>Semi-Urban</option>

</select>

<label>Study Hours Per Day</label>

<input type="number"
step="0.1"
name="study_hours_per_day"
required>

<label>Attendance (%)</label>

<input type="number"
name="attendance_percentage"
required>

<label>Stress Level</label>

<input type="number"
name="stress_level"
required>

<label>Sleep Hours</label>

<input type="number"
step="0.1"
name="sleep_hours"
required>

<label>Motivation Level</label>

<input type="number"
name="motivation_level"
required>

<label>AI Tool Usage Hours</label>

<input type="number"
step="0.1"
name="ai_tool_usage_hours"
required>

<label>Gaming Hours</label>

<input type="number"
step="0.1"
name="gaming_hours"
required>

<br><br>

<button>

Predict Performance

</button>

</form>

</div>

</body>

</html>
